<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语义判断审核</title>
<style>
:root {
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
  --accent: #2a78d6; --accent-bg: #e6f0fc;
  --semantic: #d95926; --semantic-bg: #fdeee6;
  --mech: #8a8984; --ctx: #2a78d6; --good: #0b8a0b; --good-bg: #e5f4e5; --warn-bg: #fff4dc;
  --mono: "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-bg: #1b2a3d;
    --semantic: #ec835a; --semantic-bg: #3a2419;
    --mech: #8f8e86; --ctx: #3987e5; --good: #4cc24c; --good-bg: #1d301d; --warn-bg: #3a3017;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
button, select, input, textarea { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { font-weight: 600; font-size: 15px; }
.progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 220px; flex: 1; }
.progress { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--good); width: 0; transition: width .2s; }
.progress-text { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls select, .controls input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
.controls input { width: 190px; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.position { color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
.card h2 .sub { font-weight: 400; color: var(--text-2); font-size: 13px; }
.panel { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .panel { position: static; max-height: none; } }

/* ---------- header card ---------- */
.ids { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.uid { font-family: var(--mono); font-weight: 600; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
.badge.dev { background: var(--accent-bg); color: var(--accent); }
.badge.done { background: var(--good-bg); color: var(--good); }
.badge.flag { background: var(--warn-bg); }
.question { font-size: 18px; font-weight: 600; margin: 4px 0 10px; white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.fact .k { color: var(--muted); font-size: 12px; }
.fact .v { font-weight: 600; }

/* ---------- decisions ---------- */
.decision { border: 1px solid var(--semantic); border-radius: 8px; padding: 12px; margin-top: 10px; }
.decision:first-of-type { margin-top: 0; }
.decision .title { font-weight: 600; color: var(--semantic); }
.decision .flow { margin: 4px 0 8px; color: var(--text-2); }
.decision .flow code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr.chosen td { background: var(--semantic-bg); }
td.check { width: 28px; color: var(--semantic); font-weight: 700; }
td.extra { color: var(--text-2); font-size: 12.5px; }

/* ---------- topology ---------- */
.topo-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.topo text { font-size: 12px; fill: var(--text); }
.topo .node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.topo .node.decision-end rect { stroke: var(--semantic); stroke-width: 1.6; }
.topo .ctx { fill: var(--ctx); font-size: 11px; }
.topo .steplabel { fill: var(--muted); font-size: 11.5px; }
.topo .node { cursor: pointer; }
.topo .node:hover rect { stroke: var(--accent); }
.topo .node .sub { fill: var(--text-2); font-size: 11px; }
.topo path { fill: none; }
.topo .e-semantic { stroke: var(--semantic); stroke-width: 2.4; }
.topo .e-mech { stroke: var(--mech); stroke-width: 1.5; }
.topo .elabel { font-size: 11px; paint-order: stroke; stroke: var(--surface-2); stroke-width: 4px; stroke-linejoin: round; }
.topo .elabel.semantic { fill: var(--semantic); font-weight: 600; }
.topo .elabel.mech { fill: var(--text-2); }
.topo-tools { display: flex; align-items: center; gap: 10px; margin-left: auto; font-weight: 400; }
.topo-hint { color: var(--muted); font-size: 12.5px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--text-2); font-size: 12.5px; margin-top: 8px; }
.legend svg { vertical-align: middle; margin-right: 4px; }

/* ---------- calls ---------- */
.call { border-top: 1px solid var(--border); padding: 12px 0; }
.call:first-of-type { border-top: 0; padding-top: 0; }
.call.flash { animation: flash 1.2s; }
@keyframes flash { from { background: var(--accent-bg); } to { background: transparent; } }
.call-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.call-head .num { font-family: var(--mono); color: var(--muted); }
.call-head .name { font-family: var(--mono); font-weight: 600; }
.call-head .desc { color: var(--text-2); }
.args { margin: 6px 0; }
.args td:first-child { font-family: var(--mono); width: 160px; }
.args td.val { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.src { display: inline-block; margin: 0 4px 2px 0; padding: 0 6px; border-radius: 4px; font-size: 11.5px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.src.up { background: var(--semantic-bg); color: var(--semantic); }
.src.ctx { background: var(--accent-bg); color: var(--accent); }
details > summary { cursor: pointer; color: var(--text-2); }
pre.result { max-height: 420px; overflow: auto; background: var(--surface-2); border-radius: 6px; padding: 10px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
.err { color: var(--semantic); font-weight: 600; }
.answer { white-space: pre-wrap; max-height: 360px; overflow: auto; background: var(--surface-2); border-radius: 6px; padding: 10px; }
.history .msg { margin: 6px 0; }
.history .role { display: inline-block; min-width: 42px; color: var(--muted); }

/* ---------- panel ---------- */
.panel h3 { font-size: 14px; margin: 14px 0 6px; }
.panel h3:first-child { margin-top: 0; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-bg); }
.opt input { margin-top: 4px; }
.key { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; user-select: none; }
.tag.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: 7px; padding: 8px; background: var(--surface); resize: vertical; }
.save-row { display: flex; gap: 8px; margin-top: 12px; }
.save-row .btn { flex: 1; padding: 7px; }
.status { margin-top: 8px; color: var(--text-2); font-size: 12.5px; min-height: 20px; }
.status.ok { color: var(--good); }
.status.bad { color: var(--semantic); }
.help { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.empty { padding: 60px; text-align: center; color: var(--text-2); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">语义判断审核 · FinMCP D 组</div>
  <div class="progress-wrap">
    <div class="progress"><div id="bar"></div></div>
    <span class="progress-text" id="progressText">加载中…</span>
  </div>
  <div class="controls">
    <select id="fStatus" title="按完成情况筛选">
      <option value="all">全部</option><option value="todo">未完成</option><option value="done">已完成</option>
    </select>
    <select id="fSplit" title="按切分筛选">
      <option value="all">开发 + 测试</option><option value="dev">开发集</option><option value="test">测试集</option>
    </select>
    <button class="btn" id="prev" title="上一条（←）">← 上一条</button>
    <span class="position" id="position"></span>
    <button class="btn" id="next" title="下一条（→）">下一条 →</button>
    <input id="jump" placeholder="跳转，如 multi_tool:30" title="输入 id 后回车">
  </div>
</header>

<main class="layout">
  <section class="content" id="content"><div class="card empty">加载中…</div></section>
  <aside class="panel card" id="panel">
    <h3>1. 这些步骤真的需要语义判断吗？</h3>
    <div id="optSemantic"></div>
    <h3>2. 参考轨迹的选择合理吗？</h3>
    <div id="optReference"></div>
    <h3>常见情况（可多选）</h3>
    <div class="tags" id="tags"></div>
    <h3>备注</h3>
    <textarea id="note" placeholder="可选。例如：应该再选上 ZH013136"></textarea>
    <div class="save-row">
      <button class="btn" id="clear" title="清除这一条的判断">清除</button>
      <button class="btn primary" id="saveNext" title="回车">下一条未完成 →</button>
    </div>
    <div class="status" id="status"></div>
    <div class="help">
      每次修改都会自动保存到本地 <code>review_labels.json</code>，并同步到 <code>review.csv</code>。<br>
      快捷键：<span class="mono">1 2 3</span> 回答问题 1 · <span class="mono">Q W E R</span> 回答问题 2 ·
      <span class="mono">← →</span> 翻页 · <span class="mono">Enter</span> 下一条未完成
    </div>
  </aside>
</main>

<script>
const SEM_KEYS = { yes: "1", no_rule: "2", no_other: "3" };
const REF_KEYS = { unique: "Q", multi: "W", arbitrary: "E", bad: "R" };
const TAGS = ["按数字规则就能选", "换个检索词也合理", "需要领域知识", "名称近似易混", "候选来自多次检索", "启发式误判"];
const KIND = { pick_one: "选一个", pick_subset: "选一部分", pick_all: "全选", reference: "直接引用" };
const S = { units: [], labels: {}, view: [], pos: 0, opts: {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const done = (id) => { const l = S.labels[id]; return !!(l && l.semantic && l.reference); };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

async function init() {
  try {
    const [data, labels] = await Promise.all([fetch("/api/data").then((r) => r.json()), fetch("/api/labels").then((r) => r.json())]);
    S.units = data.units; S.labels = labels; S.opts = data;
  } catch (e) {
    $("content").innerHTML = `<div class="card empty">无法读取数据。请在终端运行 <code>python finmcp-subset/review_app.py</code>，再打开它给出的地址。</div>`;
    return;
  }
  buildPanel();
  $("fStatus").value = store.get("rv.status") || "all";
  $("fSplit").value = store.get("rv.split") || "all";
  const start = decodeURIComponent(location.hash.slice(1)) || store.get("rv.id");
  applyFilter(start);
  bind();
}

function applyFilter(keepId) {
  const st = $("fStatus").value, sp = $("fSplit").value;
  store.set("rv.status", st); store.set("rv.split", sp);
  S.view = S.units.filter((u) => (sp === "all" || u.split === sp) && (st === "all" || (st === "done") === done(u.id)));
  const i = S.view.findIndex((u) => u.id === keepId);
  S.pos = i >= 0 ? i : Math.min(S.pos, Math.max(0, S.view.length - 1));
  render();
}

function progress() {
  const n = S.units.length, d = S.units.filter((u) => done(u.id)).length;
  const dev = S.units.filter((u) => u.split === "dev"), dd = dev.filter((u) => done(u.id)).length;
  $("bar").style.width = `${(100 * d) / n}%`;
  $("progressText").textContent = `已完成 ${d} / ${n}（开发集 ${dd} / ${dev.length}）`;
  $("position").textContent = S.view.length ? `${S.pos + 1} / ${S.view.length}` : "0 / 0";
}

function render() {
  progress();
  const u = S.view[S.pos];
  if (!u) {
    $("content").innerHTML = `<div class="card empty">当前筛选下没有数据。</div>`;
    fillPanel(null);
    return;
  }
  store.set("rv.id", u.id);
  history.replaceState(null, "", "#" + encodeURIComponent(u.id));
  $("content").innerHTML = [headCard(u), decisionsCard(u), topoCard(u), callsCard(u), answerCard(u), historyCard(u)].join("");
  $("content").querySelectorAll("[data-call]").forEach((el) => el.addEventListener("click", () => {
    const target = $("call-" + el.dataset.call);
    if (target) { target.scrollIntoView({ behavior: "smooth", block: "center" }); target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash"); }
  }));
  $("content").querySelectorAll("details[data-lazy]").forEach((d) => d.addEventListener("toggle", () => {
    const pre = d.querySelector("pre");
    if (d.open && !pre.dataset.filled) { pre.textContent = u.calls[+d.dataset.lazy].result; pre.dataset.filled = "1"; }
  }));
  fillPanel(u);
  S.fit = true;
  fitTopo();
  $("topoFit").addEventListener("click", () => { S.fit = !S.fit; fitTopo(); });
  window.scrollTo({ top: 0 });
}

// Scale the topology to the card width when that keeps it legible; otherwise scroll horizontally.
function fitTopo() {
  const wrap = document.querySelector(".topo-wrap"), svg = wrap && wrap.querySelector("svg");
  if (!svg) return;
  const w = +svg.getAttribute("width"), h = +svg.getAttribute("height"), avail = wrap.clientWidth - 2;
  const ratio = avail / w, canFit = w > avail && ratio >= 0.5;
  const scaled = S.fit && canFit;
  svg.style.width = (scaled ? avail : w) + "px";
  svg.style.height = (scaled ? h * ratio : h) + "px";
  $("topoFit").style.display = canFit ? "" : "none";
  $("topoFit").textContent = scaled ? "原始大小" : "适合宽度";
  $("topoHint").textContent = !scaled && w > avail ? "图较宽，可横向滚动 →" : "";
}
window.addEventListener("resize", () => fitTopo());

// ---------------------------------------------------------------- cards
function headCard(u) {
  const flags = u.flags.map((f) => `<span class="badge flag">${esc(f)}</span>`).join("");
  const nSem = u.edges.filter((e) => e.kind === "pick_one" || e.kind === "pick_subset").length;
  const nMech = u.edges.filter((e) => e.kind === "reference" || e.kind === "pick_all").length;
  return `<div class="card">
    <div class="ids"><span class="uid">${esc(u.id)}</span>
      <span class="badge ${u.split === "dev" ? "dev" : ""}">${u.split === "dev" ? "开发集" : "测试集"}</span>
      <span class="badge">${u.source === "multi_tool" ? "多工具任务" : "多轮对话的一轮"}</span>
      ${done(u.id) ? '<span class="badge done">已完成</span>' : ""}${flags}</div>
    <div class="question">${esc(u.question)}</div>
    <div class="facts">
      <div class="fact"><div class="k">工具链长度</div><div class="v">${u.n_calls} 次调用 · ${u.n_steps} 步${u.has_parallel ? " · 含并行" : ""}</div></div>
      <div class="fact"><div class="k">依赖</div><div class="v">语义判断 ${nSem} · 机械依赖 ${nMech}</div></div>
      <div class="fact"><div class="k">难度</div><div class="v">${esc(u.difficulty || "-")}</div></div>
      <div class="fact"><div class="k">场景</div><div class="v">${esc(u.scenery)}</div></div>
      <div class="fact"><div class="k">用户 id</div><div class="v mono">${esc(u.user_id || "无")}</div></div>
    </div></div>`;
}

function decisionsCard(u) {
  const items = u.decisions.map((d, i) => {
    const k = d.gold.length;
    const rows = d.rows.length
      ? `<table><thead><tr><th></th><th>代码</th><th>名称</th><th>其他字段</th></tr></thead><tbody>${d.rows.map((r) => `
          <tr class="${r.chosen ? "chosen" : ""}"><td class="check">${r.chosen ? "✓" : ""}</td>
          <td class="mono">${esc(r.key)}</td><td>${esc(r.label)}</td><td class="extra">${r.extra.map(esc).join("<br>")}</td></tr>`).join("")}
        </tbody></table>`
      : `<div class="extra">没有抽到候选记录。选中的值：<span class="mono">${esc(d.gold.join(", "))}</span></div>`;
    return `<div class="decision">
      <div class="title">语义判断 ${i + 1}：${KIND[d.kind] || d.kind}（${d.n} 个候选中选了 ${k} 个）</div>
      <div class="flow">从 <code>${esc(d.src)}</code> 的返回里挑选，传给 <code>${esc(d.dst)}</code></div>${rows}</div>`;
  }).join("");
  return `<div class="card"><h2>待判断的步骤 <span class="sub">高亮行是参考轨迹选中的候选</span></h2>${items}</div>`;
}

function topoCard(u) {
  return `<div class="card"><h2>工具链路拓扑 <span class="sub">从上到下是调用步骤；点节点跳到调用明细</span>
      <span class="topo-tools"><span class="topo-hint" id="topoHint"></span><button class="btn" id="topoFit">原始大小</button></span></h2>
    <div class="topo-wrap">${topology(u)}</div>
    <div class="legend">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--semantic)" stroke-width="2.4"/></svg>语义判断（从多个候选里挑选）</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--mech)" stroke-width="1.5"/></svg>机械依赖（直接引用 / 全选）</span>
      <span><span style="color:var(--ctx)">节点里的蓝字</span>：参数来自客户原话</span>
      <span>跨越多步的依赖从右侧绕行</span>
    </div></div>`;
}

function topology(u) {
  // Vertical layout: one band per step (top to bottom); parallel calls side by side, at most 3 per line.
  // Edges between adjacent steps are drawn directly; edges that skip steps run along lanes on the right.
  const W = 250, H = 62, CG = 16, LG = 12, RG = 46, P = 16, LEFT = 58, PER = 3, LABEL_GAP = 130, LANE = 11;
  const steps = [...new Set(u.calls.map((c) => c.step))].sort((a, b) => a - b);
  const byStep = new Map(steps.map((s) => [s, u.calls.filter((c) => c.step === s)]));
  const ctxArgs = {};
  u.edges.filter((e) => e.kind === "context").forEach((e) => (ctxArgs[e.to] = ctxArgs[e.to] || []).push(e.arg));
  const pos = {}, bandY = [], line = {};
  let y = P, maxCols = 1, lineNo = 0;
  steps.forEach((s) => {
    const calls = byStep.get(s), lines = Math.ceil(calls.length / PER);
    bandY.push({ step: s, y, h: lines * H + (lines - 1) * LG });
    calls.forEach((c, i) => {
      pos[c.index] = { x: LEFT + (i % PER) * (W + CG), y: y + Math.floor(i / PER) * (H + LG) };
      line[c.index] = lineNo + Math.floor(i / PER);
    });
    maxCols = Math.max(maxCols, Math.min(PER, calls.length));
    lineNo += lines;
    y += lines * H + (lines - 1) * LG + RG;
  });
  const areaRight = LEFT + maxCols * W + (maxCols - 1) * CG;
  const edges = u.edges.filter((e) => e.kind !== "context" && pos[e.from] && pos[e.to]);
  // Draw directly only when the target sits on the visual line right below the source; route the rest on the right.
  const isLong = (e) => line[e.to] - line[e.from] !== 1;
  const nLanes = edges.filter(isLong).length;
  const width = areaRight + (nLanes ? LABEL_GAP + nLanes * LANE : 40) + P;
  const height = y - RG + P;
  const semEnds = new Set();
  edges.forEach((e) => { if (e.kind === "pick_one" || e.kind === "pick_subset") { semEnds.add(e.from); semEnds.add(e.to); } });

  const isSem = (e) => e.kind === "pick_one" || e.kind === "pick_subset";
  const textOf = (e) => isSem(e) ? `${e.arg} · ${e.n}选${e.k}` : e.kind === "pick_all" ? `${e.arg} · 全选${e.n}` : e.arg;
  const tipOf = (e) => `${e.arg} ← #${e.from + 1} ${e.path}\n${KIND[e.kind]}：${e.n} 个候选中用了 ${e.k} 个\n${(e.values || []).join(", ")}`;
  const pair = {}, enter = {};
  let lane = 0;
  const drawn = [...edges].sort((a, b) => isSem(a) - isSem(b)).map((e) => {
    const a = pos[e.from], b = pos[e.to], cls = isSem(e) ? "e-semantic" : "e-mech", marker = isSem(e) ? "arSem" : "arMech";
    let d, lx, ly, anchor = "middle";
    if (!isLong(e)) {
      const key = `${e.from}-${e.to}`, k = (pair[key] = (pair[key] || 0) + 1) - 1, off = (k % 3 - 1) * 10;
      const x1 = a.x + W / 2 + off, y1 = a.y + H, x2 = b.x + W / 2 + off, y2 = b.y;
      d = `M${x1},${y1} C${x1},${y1 + RG / 2} ${x2},${y2 - RG / 2} ${x2},${y2}`;
      lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 + 4;
    } else {
      const lxPos = areaRight + LABEL_GAP + lane++ * LANE;
      const k = (enter[e.to] = (enter[e.to] || 0) + 1) - 1, yIn = b.y + 16 + (k % 3) * 15;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x + W;
      d = `M${x1},${y1} H${lxPos - 6} Q${lxPos},${y1} ${lxPos},${y1 + 6} V${yIn - 6} Q${lxPos},${yIn} ${lxPos - 6},${yIn} H${x2}`;
      lx = x2 + 8; ly = yIn - 4; anchor = "start";
    }
    const label = `<text class="elabel ${isSem(e) ? "semantic" : "mech"}" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(cut(textOf(e), 22))}</text>`;
    return `<g><title>${esc(tipOf(e))}</title><path class="${cls}" d="${d}" marker-end="url(#${marker})"/>${label}</g>`;
  }).join("");

  const bands = bandY.map((b) => `<text class="steplabel" x="${P}" y="${b.y + b.h / 2 + 4}">第 ${b.step} 步</text>`).join("");
  const nodes = u.calls.map((c) => {
    const p = pos[c.index], ctx = ctxArgs[c.index] || [];
    return `<g class="node ${semEnds.has(c.index) ? "decision-end" : ""}" data-call="${c.index}" transform="translate(${p.x},${p.y})">
      <title>#${c.index + 1} ${esc(c.name)}\n${esc(c.desc)}\n返回 ${c.chars} 字符${ctx.length ? "\n原话参数：" + esc(ctx.join("、")) : ""}</title>
      <rect width="${W}" height="${H}" rx="7"/>
      <text x="10" y="18">#${c.index + 1} ${esc(cut(c.name, 28))}${c.error ? " ⚠" : ""}</text>
      <text class="sub" x="10" y="35">${esc(cut(c.desc || "", 19))}</text>
      ${ctx.length ? `<text class="ctx" x="10" y="52">原话：${esc(cut(ctx.join("、"), 22))}</text>` : ""}</g>`;
  }).join("");
  const defs = `<defs>${[["arSem", "var(--semantic)"], ["arMech", "var(--mech)"]].map(([id, color]) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>`).join("")}</defs>`;
  return `<svg class="topo" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="工具调用拓扑">${defs}${bands}${drawn}${nodes}</svg>`;
}

function srcBadge(s) {
  const cls = s.startsWith("上游") ? "up" : s === "客户原话" ? "ctx" : "";
  return `<span class="src ${cls}">${esc(s)}</span>`;
}

function callsCard(u) {
  const items = u.calls.map((c) => `<div class="call" id="call-${c.index}">
      <div class="call-head"><span class="num">#${c.index + 1} · 第 ${c.step} 步</span><span class="name">${esc(c.name)}</span><span class="desc">${esc(c.desc)}</span></div>
      <table class="args"><tbody>${c.args.length ? c.args.map((a) => `<tr><td>${esc(a.name)}</td><td class="val">${esc(a.value)}</td>
        <td style="width:150px">${a.sources.map(srcBadge).join("")}</td></tr>`).join("") : `<tr><td colspan="3" class="extra">无参数</td></tr>`}</tbody></table>
      <details data-lazy="${c.index}"><summary>返回结果：${c.chars.toLocaleString()} 字符${c.error ? ' <span class="err">含报错或非 JSON</span>' : ""}${c.truncated ? "（只显示前 30,000 字符）" : ""}</summary><pre class="result"></pre></details>
    </div>`).join("");
  return `<div class="card"><h2>工具调用明细 <span class="sub">${u.calls.length} 次调用 · 工具功能说明根据工具名、参数和返回推断</span></h2>${items}</div>`;
}

function answerCard(u) {
  return `<div class="card"><h2>参考回答</h2><div class="answer">${esc(u.answer || "（无）")}</div></div>`;
}

function historyCard(u) {
  if (!u.history.length) return "";
  const roles = { user: "用户", assistant: "助手", tool: "工具", system: "系统" };
  return `<div class="card history"><details><summary>本轮之前的对话（${u.history.length} 条消息）</summary>${u.history.map((m) =>
    `<div class="msg"><span class="role">${roles[m.role] || m.role}</span>${esc(m.text)}</div>`).join("")}</details></div>`;
}

// ---------------------------------------------------------------- panel
function buildPanel() {
  const radio = (name, opts, keys) => Object.entries(opts).map(([v, label]) =>
    `<label class="opt" data-name="${name}" data-value="${v}"><input type="radio" name="${name}" value="${v}"><span>${esc(label)}</span><span class="key">${keys[v]}</span></label>`).join("");
  $("optSemantic").innerHTML = radio("semantic", S.opts.semantic_options, SEM_KEYS);
  $("optReference").innerHTML = radio("reference", S.opts.reference_options, REF_KEYS);
  $("tags").innerHTML = TAGS.map((t) => `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("");
}

function fillPanel(u) {
  const l = (u && S.labels[u.id]) || {};
  document.querySelectorAll(".opt").forEach((el) => {
    const on = l[el.dataset.name] === el.dataset.value;
    el.classList.toggle("on", on); el.querySelector("input").checked = on;
  });
  document.querySelectorAll(".tag").forEach((el) => el.classList.toggle("on", (l.tags || []).includes(el.dataset.tag)));
  $("note").value = l.note || "";
  setStatus(l.updated ? `已保存 · ${l.updated.replace("T", " ")}` : "未判断", l.updated ? "ok" : "");
}

function currentLabel() {
  const pick = (name) => (document.querySelector(`input[name="${name}"]:checked`) || {}).value || null;
  const tags = [...document.querySelectorAll(".tag.on")].map((el) => el.dataset.tag);
  const label = { semantic: pick("semantic"), reference: pick("reference"), tags, note: $("note").value.trim() };
  return label.semantic || label.reference || tags.length || label.note ? label : null;
}

function setStatus(text, cls) { const el = $("status"); el.textContent = text; el.className = "status " + (cls || ""); }

let saveTimer = null;
async function save() {
  const u = S.view[S.pos];
  if (!u) return;
  const label = currentLabel();
  setStatus("保存中…");
  try {
    const r = await fetch("/api/labels", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: u.id, label }) });
    if (!r.ok) throw new Error(r.status);
    const out = await r.json();
    if (out.label) S.labels[u.id] = out.label; else delete S.labels[u.id];
    setStatus(out.label ? `已保存 · ${out.label.updated.replace("T", " ")}` : "已清除", "ok");
    progress();
    const badge = document.querySelector(".ids .badge.done");
    if (done(u.id) && !badge) document.querySelector(".ids").insertAdjacentHTML("beforeend", '<span class="badge done">已完成</span>');
    if (!done(u.id) && badge) badge.remove();
  } catch (e) {
    setStatus("保存失败：请确认 review_app.py 仍在运行", "bad");
  }
}
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); };

function choose(name, value) {
  const el = document.querySelector(`.opt[data-name="${name}"][data-value="${value}"]`);
  if (!el) return;
  document.querySelectorAll(`.opt[data-name="${name}"]`).forEach((o) => { o.classList.remove("on"); o.querySelector("input").checked = false; });
  el.classList.add("on"); el.querySelector("input").checked = true;
  save();
}

function go(delta) {
  if (!S.view.length) return;
  S.pos = (S.pos + delta + S.view.length) % S.view.length;
  render();
}

function nextTodo() {
  if (saveTimer) { clearTimeout(saveTimer); save(); }
  const n = S.view.length;
  for (let k = 1; k <= n; k++) {
    const i = (S.pos + k) % n;
    if (!done(S.view[i].id)) { S.pos = i; return render(); }
  }
  setStatus("当前筛选下已全部完成", "ok");
}

function bind() {
  $("fStatus").addEventListener("change", () => applyFilter((S.view[S.pos] || {}).id));
  $("fSplit").addEventListener("change", () => applyFilter((S.view[S.pos] || {}).id));
  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  $("saveNext").addEventListener("click", nextTodo);
  $("clear").addEventListener("click", () => { fillPanel(null); save(); });
  $("jump").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const id = e.target.value.trim();
    let i = S.view.findIndex((u) => u.id === id);
    if (i < 0 && S.units.some((u) => u.id === id)) { $("fStatus").value = "all"; $("fSplit").value = "all"; applyFilter(id); return; }
    if (i >= 0) { S.pos = i; render(); } else setStatus(`没有找到 ${id}`, "bad");
  });
  document.querySelectorAll(".opt").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); choose(el.dataset.name, el.dataset.value); }));
  $("tags").addEventListener("click", (e) => { const t = e.target.closest(".tag"); if (t) { t.classList.toggle("on"); save(); } });
  $("note").addEventListener("input", saveSoon);
  document.addEventListener("keydown", (e) => {
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const sem = Object.keys(SEM_KEYS).find((v) => SEM_KEYS[v] === k), ref = Object.keys(REF_KEYS).find((v) => REF_KEYS[v] === k);
    if (sem) choose("semantic", sem);
    else if (ref) choose("reference", ref);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "Enter") nextTodo();
    else return;
    e.preventDefault();
  });
}

init();
</script>
</body>
</html>
